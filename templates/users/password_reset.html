{% extends 'users/login.html' %}
{% load widget_tweaks %}
{% block content %}
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Восстановление пароля</h5>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                {% render_field form.email class="form-control" %}
                                {% if form.email.errors %}
                                    <div class="alert alert-danger mt-2">{{ form.email.errors|first }}</div>
                                {% endif %}
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Отправить
                            </button>

                            <div class="text-center mt-3">
                                <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100">
                                    ← Назад
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
