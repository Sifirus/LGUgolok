<nav class="topbar">
    <div class="topbar-left">
        <a href="{% url 'index' %}" class="brand">
            <span class="brand-mark"><i class="bi bi-house-door-fill"></i></span>
            <span class="brand-text">
                ЛГУголок
                <small>Система бронирования</small>
            </span>
        </a>
    </div>

    <div class="topbar-links">
        <a href="{% url 'index' %}" class="top-link">Главная</a>
        <a href="{% url 'booking_create' %}" class="top-link">Создать заявку</a>
        <a href="{% url 'approval' %}" class="top-link">Согласования</a>

        {# TODO: разделение по ролям #}
        <a href="{% url 'admin_panel_users' %}" class="top-link">Пользователи</a>
        <a href="/admin/" class="top-link">Админка</a>
    </div>

    <div class="topbar-right">
        <a href="{% url 'profile' %}" class="profile-link" title="Профиль">
            {% if avatar %}
                <img src="{{ avatar.url }}" class="profile-avatar" alt="Avatar">
            {% else %}
                <div class="profile-avatar profile-fallback">
                    {{ avatar_alt|default:"U" }}
                </div>
            {% endif %}
        </a>

        <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn-logout">Выйти</button>
        </form>

        <button type="button" class="burger" onclick="toggleTopnav()" aria-label="Меню">
            <i class="bi bi-list"></i>
        </button>
    </div>

    <div class="topnav-mobile" id="topnavMobile">
        <a href="{% url 'index' %}" class="topnav-item">Главная</a>
        <a href="{% url 'booking_create' %}" class="topnav-item">Создать заявку</a>
        <a href="{% url 'approval' %}" class="topnav-item">Согласования</a>

        {# TODO: разделение по ролям #}
        <a href="{% url 'admin_panel_users' %}" class="topnav-item">Пользователи</a>
        <a href="/admin/" class="topnav-item">Админка</a>
    </div>
</nav>
<div class="topnav-overlay" id="topnavOverlay" onclick="closeTopnav()"></div>
